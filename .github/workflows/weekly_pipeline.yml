name: Weekly fuel price pipeline

on:
  schedule:
    # Every Tuesday 14:17 Asia/Manila (06:17 UTC). Off the top of the hour, where GitHub delays
    # scheduled runs the most; runs after GasWatch PH posts the week (EventBridge fires at 14:00).
    # GitHub cron always runs in UTC.
    - cron: "17 6 * * 2"
  # Adds a "Run workflow" button under the Actions tab for manual runs
  workflow_dispatch:

permissions:
  contents: write  # needed to commit the raw JSON snapshot back to the repo

concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSLMODE: require

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-pipeline.txt
          python -m playwright install --with-deps chromium

      # Bronze: scrape gaswatchph.com -> data/raw/*.json + raw_ingestion tables
      - name: Scrape and load raw prices
        id: scrape
        run: python scraper.py

      # Silver/Gold: rebuild analytical_core models, then run data tests
      - name: Build analytics tables (dbt)
        working-directory: transformation
        run: |
          dbt run --profiles-dir .
          dbt test --profiles-dir .

      # Archive the raw payload even if dbt fails, so the bronze layer is never lost
      - name: Commit raw snapshot
        if: ${{ !cancelled() && steps.scrape.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          git diff --cached --quiet || git commit -m "data: weekly fuel price snapshot $(TZ=Asia/Manila date +%F)"
          # main may have moved on since this run started (a merge, or a re-run of an older run):
          # replay the snapshot commit on top of the latest main before pushing
          git pull --rebase origin main
          git push origin HEAD:main
