# /etc/nginx/sites-available/default
# Reverse proxy: public port 80 -> Streamlit on 127.0.0.1:8501.
# Streamlit talks to the browser over WebSockets, so the Upgrade/Connection headers are required.
# For HTTPS, point a domain at the Elastic IP and run:
#   sudo certbot --nginx -d <your-domain>
# Certbot adds the "listen 443 ssl" server block and an HTTP -> HTTPS redirect to this file.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
