litroph:
  target: dev
  outputs:
    dev:
      type: postgres
      # Credentials come from environment variables (.env locally, GitHub Actions secrets in CI)
      host: "{{ env_var('DB_HOST') }}"
      port: "{{ env_var('DB_PORT', '5432') | as_number }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      dbname: "{{ env_var('DB_NAME') }}"
      sslmode: "{{ env_var('DB_SSLMODE', 'prefer') }}"
      schema: analytical_core
      threads: 1
      connect_timeout: 30
